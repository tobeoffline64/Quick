[workspace]
resolver = "2"
members = [
    "crates/quick-core",
    "crates/quick-style",
    "crates/quick-render",
    "crates/quick-window",
    "crates/quick-layout",
    "crates/quick-widgets",
    "crates/quick-markup",
    "crates/quick",
    "apps/hello-world",
    "apps/quick-gallery",
    "examples/hello_world",
    "examples/quick_counter",
    "examples/device_showcase",
    "examples/silver_app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Quick Framework Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/tobeoffline64/Quick"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
toml = "0.8"
quick-xml = { version = "0.37", features = ["serialize"] }
taffy = "0.6"
winit = { version = "0.30", features = ["rwh_06", "wayland", "x11"] }
raw-window-handle = "0.6"
softbuffer = { version = "0.4", default-features = false, features = ["wayland", "x11rb"] }
vello = "0.3"
wgpu = "23.0"
kurbo = "0.11"
peniko = "0.3"
pollster = "0.3"
silver = { path = "../silver/crates/silver", version = "0.1.0" }
smallvec = { version = "1.13", features = ["serde"] }
slotmap = { version = "1.0", features = ["serde"] }
parking_lot = "0.12"
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"
memchr = "2.7"
simdutf8 = "0.1"
bumpalo = { version = "3.16", features = ["collections"] }
mimalloc = { version = "0.1", default-features = false }

# Performance profile inspired by Bun / high-performance native binaries
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
